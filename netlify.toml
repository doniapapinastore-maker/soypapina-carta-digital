[build]
  functions = "netlify/functions"

# soypapina.com.ar/banda es la página de La Banda de Papina
[[redirects]]
  from = "/banda"
  to = "/banda.html"
  status = 200

# El link viejo /club lleva a la misma página
[[redirects]]
  from = "/club"
  to = "/banda.html"
  status = 200

# soypapina.com.ar/como-nos-fue abre la encuesta (para mandar a los que piden por WhatsApp)
[[redirects]]
  from = "/como-nos-fue"
  to = "/?encuesta=whatsapp"
  status = 302
